services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arrowfin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env first}
      POSTGRES_DB: arrowfin
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - arrowfin-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrowfin -d arrowfin"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  arrowfin-data:
